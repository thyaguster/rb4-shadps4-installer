name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build portable ZIP and Setup
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          ./packaging/build-release.ps1 -Version $version

      - name: Create checksums
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $release = Join-Path $PWD "release-v$version"
          Get-ChildItem -LiteralPath $release -File |
            Where-Object Name -Match '\.(zip|exe)$' |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content -LiteralPath (Join-Path $release "SHA256SUMS.txt") -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $release = Join-Path $PWD "release-v$version"
          gh release create "${{ github.ref_name }}" `
            (Join-Path $release "RB4ShadPS4Installer-Portable-v$version.zip") `
            (Join-Path $release "RB4ShadPS4Installer-Setup-v$version.exe") `
            (Join-Path $release "SHA256SUMS.txt") `
            --title "RB4 shadPS4 Installer v$version" `
            --generate-notes `
            --verify-tag
