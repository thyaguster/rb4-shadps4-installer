name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RB4ShadPS4Installer.csproj

      - name: Build
        run: dotnet build RB4ShadPS4Installer.csproj -c Release --no-restore

      - name: Run installer smoke tests
        shell: pwsh
        run: |
          dotnet run --project TestResults/BackupCleanupSmoke/BackupCleanupSmoke.csproj -c Release
          dotnet run --project TestResults/ContentCatalogSmoke/ContentCatalogSmoke.csproj -c Release
          dotnet run --project TestResults/ContentAuditSmoke/ContentAuditSmoke.csproj -c Release
          dotnet run --project TestResults/CrashReportSmoke/CrashReportSmoke.csproj -c Release
          dotnet run --project TestResults/ResumableDownloadSmoke/ResumableDownloadSmoke.csproj -c Release
          dotnet run --project TestResults/EmulatorRollbackSmoke/EmulatorRollbackSmoke.csproj -c Release
          dotnet run --project TestResults/RecoveryProfilesSmoke/RecoveryProfilesSmoke.csproj -c Release
          ./tools/test-duplicate-guard.ps1

      - name: Publish portable executable
        shell: pwsh
        run: |
          $version = ([xml](Get-Content RB4ShadPS4Installer.csproj)).Project.PropertyGroup.Version
          dotnet publish RB4ShadPS4Installer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o artifacts/portable
          Rename-Item artifacts/portable/RB4ShadPS4Installer.exe "RB4ShadPS4Installer-Portable-v$version.exe"

      - name: Upload portable build
        uses: actions/upload-artifact@v7
        with:
          name: RB4ShadPS4Installer-Portable
          path: artifacts/portable/RB4ShadPS4Installer-Portable-v*.exe
          if-no-files-found: error
